application.title=COOP_JAVA_PROJECT
application.vendor=Taibah University - Yanbu
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
debug.classpath=\
    ${run.classpath}
debug.test.classpath=\
    ${run.test.classpath}
dist.archive.excludes=
dist.dir=dist
dist.jar=${dist.dir}/COOP_JAVA_PROJECT.jar
dist.javadoc.dir=${dist.dir}/javadoc
endorsed.classpath=
excludes=
file.reference.derby.jar=lib/derby.jar
file.reference.derbytools.jar=lib/derbytools.jar
file.reference.poi.jar=lib/poi.jar
file.reference.poi-ooxml.jar=lib/poi-ooxml.jar
file.reference.poi-ooxml-lite.jar=lib/poi-ooxml-lite.jar
file.reference.xmlbeans.jar=lib/xmlbeans.jar
file.reference.commons-collections4.jar=lib/commons-collections4.jar
file.reference.commons-io.jar=lib/commons-io.jar
file.reference.commons-compress.jar=lib/commons-compress.jar
file.reference.log4j-api.jar=lib/log4j-api.jar
file.reference.log4j-core.jar=lib/log4j-core.jar
file.reference.jsvg.jar=lib/jsvg.jar
file.reference.annotations.jar=lib/annotations.jar
includes=**
javac.classpath=\
    ${file.reference.derby.jar}:\
    ${file.reference.derbytools.jar}:\
    ${file.reference.poi.jar}:\
    ${file.reference.poi-ooxml.jar}:\
    ${file.reference.poi-ooxml-lite.jar}:\
    ${file.reference.xmlbeans.jar}:\
    ${file.reference.commons-collections4.jar}:\
    ${file.reference.commons-io.jar}:\
    ${file.reference.commons-compress.jar}:\
    ${file.reference.log4j-api.jar}:\
    ${file.reference.log4j-core.jar}:\
    ${file.reference.jsvg.jar}:\
    ${file.reference.annotations.jar}
javac.compilerargs=
javac.deprecation=false
javac.external.vm=false
javac.processorpath=\
    ${javac.classpath}
javac.source=11
javac.target=11
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
javac.test.processorpath=\
    ${javac.test.classpath}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
main.class=coop.Main
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF
platform.active=default_platform
run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.jvmargs=-Dfile.encoding=UTF-8
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
source.encoding=UTF-8
src.dir=src
test.src.dir=test

